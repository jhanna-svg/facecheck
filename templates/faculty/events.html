<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class & Events - Faculty - FaceCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {50:'#f8fafc',100:'#f1f5f9',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a'} } } } }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/dashboard" class="text-primary-900 font-semibold">← Back to Dashboard</a>
            <h1 class="text-lg font-bold text-primary-900">Class & Events</h1>
            <div></div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6">
            <h2 class="text-xl font-semibold text-primary-900 mb-4">Your Events</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {% for ev in events %}
                <div class="border border-gray-200 rounded-lg p-4">
                    <div class="flex items-center justify-between mb-2">
                        <h3 class="font-semibold text-primary-900">{{ ev.event_name }}</h3>
                        <span class="text-xs text-primary-600">{{ ev.event_date.date() }}</span>
                    </div>
                    <p class="text-sm text-primary-700 mb-2">{{ ev.desc }}</p>
                    <p class="text-xs text-primary-600">Room: {{ ev.room }}</p>
                </div>
                {% else %}
                <div class="col-span-full text-center text-primary-600 py-8">No events found.</div>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
