<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Summaries - Faculty - FaceCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: {50:'#f8fafc',100:'#f1f5f9',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a'} } } } }
    </script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-slate-100 font-sans">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/reports" class="text-primary-900 font-semibold">← Back to Reports</a>
            <h1 class="text-lg font-bold text-primary-900">Class Summaries</h1>
            <div></div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Class</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">EDP Code</th>
                            <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total Attendance Entries</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        {% for name, code, total in rows %}
                        <tr>
                            <td class="px-4 py-3 text-sm text-primary-900">{{ name }}</td>
                            <td class="px-4 py-3 text-sm text-primary-900">{{ code }}</td>
                            <td class="px-4 py-3 text-sm text-primary-900">{{ total }}</td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="px-4 py-6 text-center text-sm text-primary-600">No data available.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
